name: Crypto Pulse Update

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:        # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r 00_foundation_crypto_ingestion/methods/github_actions/requirements.txt

      - name: Run Script
        run: python 00_foundation_crypto_ingestion/methods/github_actions/update_crypto_sheet.py